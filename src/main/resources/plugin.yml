name: NordPets
version: '${project.version}'
main: com.nordfjell.nordpets.NordPetsPlugin
api-version: '26.2'
folia-supported: true
author: Nord Fjell
description: Prevents players from attacking tameable animals owned by somebody else.

commands:
  nordpets:
    description: Reload NordPets configuration.
    usage: /nordpets reload
    permission: nordpets.admin

permissions:
  nordpets.bypass:
    description: Allows damaging pets owned by other players.
    default: false
  nordpets.admin:
    description: Allows reloading NordPets.
    default: op

